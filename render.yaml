# Render Blueprint: GI Tracker + its Postgres database, in Singapore (closest region to India).
# Render dashboard → New → Blueprint → pick this repository. It asks for ADMIN_EMAIL and ADMIN_PASSWORD once.
# Render serves HTTPS itself, so Caddy (docker-compose.yml, for a VPS) isn't used here.
services:
  - type: web
    name: gi-tracker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb # the server uses well under 100 MB; size up if Render's metrics say so
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit # every push to main deploys; database migrations run on start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gi-tracker-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Render runs behind Cloudflare: its CF-Connecting-IP is the visitor (clients can't set it themselves).
      # Check after deploying: sign in, then open /api/auth/network.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip,true-client-ip,x-forwarded-for:first
      - key: DB_POOL_SIZE
        value: "10"
      - key: RAZORPAY_SYNC_MINUTES
        value: "60"

databases:
  - name: gi-tracker-db
    region: singapore
    plan: 0.1c-256mb # fine for a few sites; 1 million events take roughly 1 GB
    diskSizeGB: 5 # can grow later, never shrink
    databaseName: gitracker
    user: gitracker
    postgresMajorVersion: "16"
